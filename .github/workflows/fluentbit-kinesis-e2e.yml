name: fluentbit-kinesis full-stack e2e

# Runs the full fluentbit-kinesis stack (Azurite + Event Hubs emulator +
# aws2azure + Fluent Bit), lets Fluent Bit's real, unmodified
# `kinesis_streams` output plugin ship synthetic log records generated by
# its own `dummy` input plugin, and proves the records reached (and can be
# read back from) the Kinesis stream aws2azure exposes over Azure Event
# Hubs -- see README.md "What this does NOT prove" for the sequence-number
# / iterator-continuity caveats this does not exercise.
#
# Lighter than the Airflow-based case studies (no Postgres/webserver/
# scheduler boot), but still runs on the same cadence convention: nightly,
# manual dispatch, or an explicit `run-integration` label on a PR that
# touches this case study.

on:
  schedule:
    - cron: "30 6 * * *" # nightly, 06:30 UTC
  workflow_dispatch: {}
  pull_request:
    types: [labeled, synchronize, reopened]
    paths:
      - "case-studies/fluentbit-kinesis/**"
      - ".github/workflows/fluentbit-kinesis-e2e.yml"

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - 'case-studies/fluentbit-kinesis/**'
              - '.github/workflows/fluentbit-kinesis-e2e.yml'

  e2e:
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        (needs.changes.outputs.relevant == 'true' ||
         contains(github.event.pull_request.labels.*.name, 'run-integration'))))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: case-studies/fluentbit-kinesis
    steps:
      - uses: actions/checkout@v4

      - name: Start the full stack
        run: docker compose up --build -d

      - name: Map the Kinesis routing hostname to localhost
        run: echo "127.0.0.1 kinesis.aws2azure.fluentbit-showcase.local" | sudo tee -a /etc/hosts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run full end-to-end verification
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet boto3
          .venv/bin/python scripts/verify_e2e_run.py

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
