name: airflow-s3-logging full-stack e2e

# Runs the *entire* airflow-s3-logging stack (Postgres + Airflow
# webserver/scheduler + aws2azure + Azurite), triggers a real DAG run, and
# proves the task log round-tripped through Azurite via aws2azure -- not
# just the fast call-pattern replay in verify_s3_roundtrip.py (see the
# `airflow-s3-logging smoke test` workflow for that).
#
# This is heavier (full webserver+scheduler+Postgres boot, DAG scheduling
# latency) so it runs on a slower cadence than the smoke test: nightly,
# manual dispatch, or an explicit `run-integration` label on a PR that
# touches this case study -- mirroring aws2azure's own Tier-2 conformance
# workflow convention.

on:
  schedule:
    - cron: "0 5 * * *" # nightly, 05:00 UTC
  workflow_dispatch: {}
  pull_request:
    types: [labeled, synchronize, reopened]
    paths:
      - "case-studies/airflow-s3-logging/**"
      - ".github/workflows/airflow-s3-logging-e2e.yml"

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - 'case-studies/airflow-s3-logging/**'
              - '.github/workflows/airflow-s3-logging-e2e.yml'

  e2e:
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        (needs.changes.outputs.relevant == 'true' ||
         contains(github.event.pull_request.labels.*.name, 'run-integration'))))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: case-studies/airflow-s3-logging
    steps:
      - uses: actions/checkout@v4

      - name: Start the full stack
        run: docker compose up --build -d

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run full end-to-end verification
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet boto3 requests
          .venv/bin/python scripts/verify_e2e_run.py

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
