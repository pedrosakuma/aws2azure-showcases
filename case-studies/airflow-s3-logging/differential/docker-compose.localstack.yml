# Backend A ("ground truth"): Airflow's S3 connection points directly at a
# LocalStack S3 container -- no aws2azure in the path at all.
include:
  - docker-compose.base.yml

services:
  localstack:
    # Pinned to a community-edition version: `latest` now requires a
    # LOCALSTACK_AUTH_TOKEN (Pro license) to start.
    image: localstack/localstack:3.8
    environment:
      SERVICES: s3
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  airflow-init:
    environment:
      # aws provider connection URI: aws://<key>:<secret>@/?endpoint_url=...&region_name=...
      AWS_TARGET_CONN_URI: >-
        aws://test:test@/?endpoint_url=http%3A%2F%2Flocalstack%3A4566&region_name=us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  airflow-webserver:
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy

  airflow-scheduler:
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
