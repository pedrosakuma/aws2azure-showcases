# Backend A ("ground truth"): Airflow's S3 connection points directly at a
# LocalStack S3 container -- no aws2azure in the path at all.
#
# Self-contained (no `include:`/cross-file service merging) -- an earlier
# version of this file used `include: [docker-compose.base.yml]` plus a
# per-backend override of the same service names, which works with some
# Compose versions but was rejected ("services.airflow-init conflicts with
# imported resource") by the Compose version on GitHub-hosted runners.

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.4
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
  volumes:
    - ./dags:/opt/airflow/dags:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  localstack:
    # Pinned to a community-edition version: `latest` now requires a
    # LOCALSTACK_AUTH_TOKEN (Pro license) to start.
    image: localstack/localstack:3.8
    environment:
      SERVICES: s3
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    environment:
      <<: *airflow-common-env
      # aws provider connection URI: aws://<key>:<secret>@/?endpoint_url=...&region_name=...
      AWS_TARGET_CONN_URI: >-
        aws://test:test@/?endpoint_url=http%3A%2F%2Flocalstack%3A4566&region_name=us-east-1
    command:
      - -c
      - |
        airflow db migrate && \
        airflow users create --username admin --password admin --firstname a --lastname b --role Admin --email admin@example.com && \
        airflow connections add aws_target --conn-uri "$${AWS_TARGET_CONN_URI}"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8090:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
