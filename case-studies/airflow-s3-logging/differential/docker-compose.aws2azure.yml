# Backend B ("translated"): Airflow's S3 connection points at the aws2azure
# proxy (backed by Azurite Blob Storage) -- the same setup the
# `airflow-s3-logging` case study uses.
#
# Self-contained (no `include:`/cross-file service merging) -- see the
# comment at the top of docker-compose.localstack.yml for why.

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.4
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
  volumes:
    - ./dags:/opt/airflow/dags:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck

  aws2azure:
    build:
      context: https://github.com/pedrosakuma/aws2azure.git
      dockerfile: Dockerfile
    environment:
      AWS2AZURE_CONFIG_FILE: /app/config.json
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - ./config/aws2azure-config.json:/app/config.json:ro
    depends_on:
      - azurite
    networks:
      default:
        aliases:
          - s3.aws2azure
    healthcheck:
      test: ["CMD", "/app/Aws2Azure.Proxy", "--health-check"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    environment:
      <<: *airflow-common-env
      # aws provider connection URI: aws://<key>:<secret>@/?endpoint_url=...&region_name=...
      AWS_TARGET_CONN_URI: >-
        aws://AKIA-DIFFERENTIAL-TEST:differential-local-dev-secret-not-real@/?endpoint_url=http%3A%2F%2Fs3.aws2azure%3A8080&region_name=us-east-1
    command:
      - -c
      - |
        airflow db migrate && \
        airflow users create --username admin --password admin --firstname a --lastname b --role Admin --email admin@example.com && \
        airflow connections add aws_target --conn-uri "$${AWS_TARGET_CONN_URI}"
    depends_on:
      postgres:
        condition: service_healthy
      aws2azure:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8090:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      aws2azure:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      aws2azure:
        condition: service_healthy
