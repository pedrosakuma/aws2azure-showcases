server {
    listen 8443 ssl;
    server_name kinesis.tls.aws2azure;

    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;

    location / {
        # Preserve the original Host header (e.g. "kinesis.tls.aws2azure")
        # -- aws2azure routes Kinesis requests by Host-header prefix
        # ("kinesis."), so it must see the same Host Fluent Bit's SigV4
        # signature was computed against.
        proxy_set_header Host $http_host;
        proxy_pass http://aws2azure:8080;
    }
}
