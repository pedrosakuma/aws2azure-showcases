# Fluent Bit's real, unmodified `dummy` input plugin generates deterministic
# synthetic log records; the real, unmodified `kinesis_streams` output
# plugin (the official AWS-maintained C plugin) ships them into a Kinesis
# stream pointed at aws2azure via its `endpoint`/`port` options -- the
# same zero-code-change, config-only pattern this repo's other case studies
# use for Airflow, but for a completely different client stack (C, not
# Python/JVM).
#
# aws2azure routes Kinesis requests by Host header (must start with
# "kinesis.") -- satisfied here by the "kinesis.tls.aws2azure" network
# alias docker-compose.yml gives the kinesis-tls sidecar.
#
# The kinesis_streams output always speaks TLS to its upstream (hardcoded
# in the plugin, no config toggle exists) -- Endpoint/Port here point at
# the "kinesis-tls" nginx sidecar (self-signed cert), which terminates TLS
# and forwards to aws2azure in plaintext with the original Host header
# intact. tls.verify off accepts that self-signed cert; it's a generic
# Fluent Bit output property, not a kinesis_streams-specific one.
[SERVICE]
    Flush        1
    Log_Level    info

[INPUT]
    Name           dummy
    Dummy          {"message": "hello from the real Fluent Bit kinesis_streams output plugin, routed through aws2azure to Azure Event Hubs.", "showcase": "fluentbit-kinesis"}
    Rate           1
    Samples        5
    Flush_on_Startup true

[OUTPUT]
    Name              kinesis_streams
    Match             *
    Region            us-east-1
    Stream            fluentbit-showcase-stream
    Endpoint          kinesis.tls.aws2azure
    Port              8443
    tls.verify        off
