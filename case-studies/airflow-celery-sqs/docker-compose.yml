# Apache Airflow (CeleryExecutor) + aws2azure + local Service Bus emulator.
#
# Celery's SQS transport (kombu[sqs]) is pointed at aws2azure instead of real
# SQS via a `sqs.` network alias — aws2azure routes SQS requests by Host
# header (must start with "sqs.", "sqs-", or equal "sqs" exactly), the same
# convention a real deployment satisfies via DNS/hosts pointing
# sqs.<region>.amazonaws.com at the sidecar, with zero Airflow/Celery code
# changes.
#
# This case study only became possible after three upstream aws2azure bugs
# were fixed (see README.md): #955 (GetQueueUrl false-positive against the
# Service Bus emulator, which broke kombu's check-then-create queue
# resolution), #962/#963/#964 (unrelated Key Vault bug, fixed in the same
# release cycle), and #965 (SQS module didn't buffer the request body for
# SigV4, rejecting every real boto3/kombu SQS client). The `default` queue
# (Celery's actual default queue name) is pre-declared in
# deploy/servicebus/Config.json to mirror aws2azure's own dev convention,
# but this is not strictly required: aws2azure's CreateQueue now creates
# Service Bus queues dynamically, so kombu's own create-if-missing logic
# works against a queue that was never pre-declared too.
#
# aws2azure is built directly from the upstream repo (no published image
# yet) via a remote git build context.

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.4
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres/airflow"
    AIRFLOW__CELERY__RESULT_BACKEND: "db+postgresql://airflow:airflow@postgres/airflow"
    # kombu SQS transport URL: sqs://<key>:<secret>@<host>:<port>/
    # The host must satisfy aws2azure's SQS Host-header routing rule.
    AIRFLOW__CELERY__BROKER_URL: "sqs://AKIA-AIRFLOW-CELERY-SHOWCASE:showcase-local-dev-secret-not-real@sqs.aws2azure:8080/"
    AIRFLOW__CELERY__BROKER_TRANSPORT_OPTIONS: >-
      {"region": "us-east-1", "visibility_timeout": 300}
    # boto3/kombu's SQS client isn't fork-safe: CeleryExecutor's default
    # multi-process task-sending pool (sync_parallelism) forks after the
    # HTTP connection pool is already warmed up, and concurrent sends from
    # forked children hang against aws2azure. Forcing single-process
    # (serial) sending avoids the hang; this is a known real-world
    # SQS+Celery+fork caveat, not an aws2azure-specific issue.
    AIRFLOW__CELERY__SYNC_PARALLELISM: "1"
    AIRFLOW__CORE__LOAD_EXAMPLES: "true"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
    # kombu's SQS transport needs boto3; not part of the base Airflow image.
    _PIP_ADDITIONAL_REQUIREMENTS: "boto3>=1.34 pycurl"
  volumes:
    - airflow-dags:/opt/airflow/dags
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
    aws2azure:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  mssql:
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Aws2AzureLocalDev!"

  servicebus-emulator:
    build:
      context: ./deploy/servicebus
    depends_on:
      - mssql
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: mssql
      MSSQL_SA_PASSWORD: "Aws2AzureLocalDev!"

  aws2azure:
    build:
      context: https://github.com/pedrosakuma/aws2azure.git
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      AWS2AZURE_CONFIG_FILE: /app/config.json
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - ./config/aws2azure-config.json:/app/config.json:ro
    depends_on:
      - servicebus-emulator
    networks:
      default:
        aliases:
          - sqs.aws2azure
    healthcheck:
      test: ["CMD", "/app/Aws2Azure.Proxy", "--health-check"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate && \
        airflow users create --username admin --password admin --firstname a --lastname b --role Admin --email admin@example.com
    depends_on:
      postgres:
        condition: service_healthy
      aws2azure:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-dags:
  airflow-logs:
